[workspace]
resolver = "3"
members = ["dataframe","dataset_processing"]


[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
polars = { version = "0.53.0", features = ["full"]}

[profile.release]
lto = true
strip = true
opt-level = 3
panic = "abort"
incremental = true

